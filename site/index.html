<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta id="themeColorMeta" name="theme-color" content="#f9f8f8" />
    <meta name="description" content="搜索、筛选并安装 DeepSeek Harness 社区插件。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="oh-my-dsh" />
    <meta property="og:title" content="oh-my-dsh · Everything is a plugin" />
    <meta property="og:description" content="搜索、筛选并安装 DeepSeek Harness 社区插件。" />
    <meta property="og:url" content="https://oh-my-dsh.vercel.app/" />
    <meta property="og:image" content="https://oh-my-dsh.vercel.app/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="oh-my-dsh · Everything is a plugin" />
    <meta name="twitter:description" content="搜索、筛选并安装 DeepSeek Harness 社区插件。" />
    <meta name="twitter:image" content="https://oh-my-dsh.vercel.app/og.png" />
    <link rel="canonical" href="https://oh-my-dsh.vercel.app/" />
    <title>oh-my-dsh · Everything is a plugin</title>
    <script>
      (() => {
        const saved = localStorage.getItem("oh-my-dsh-theme");
        const preference = ["light", "dark", "system"].includes(saved) ? saved : "system";
        const resolved = preference === "system"
          ? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
          : preference;
        document.documentElement.dataset.theme = resolved;
        document.documentElement.dataset.themePreference = preference;
        document.querySelector("#themeColorMeta").content = resolved === "dark" ? "#0a0a0a" : "#f9f8f8";
      })();
    </script>
    <link rel="stylesheet" href="./styles.css" />
    <script>
      window.va = window.va || function () {
        (window.vaq = window.vaq || []).push(arguments);
      };
    </script>
    <script defer src="/_vercel/insights/script.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#results">跳到插件列表</a>

    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="./" aria-label="oh-my-dsh 首页">
          <span class="brand-mark" aria-hidden="true">🐋</span>
          <span class="brand-name">oh-my-dsh</span>
        </a>
        <div class="header-actions">
          <a class="github-link" href="https://github.com/wangshunnn/oh-my-dsh" target="_blank" rel="noreferrer" aria-label="在 GitHub 查看 oh-my-dsh" title="GitHub">
            <img class="github-mark github-mark-light" src="./github-mark-black.svg" alt="" />
            <img class="github-mark github-mark-dark" src="./github-mark-white.svg" alt="" />
          </a>
          <div id="languageSwitch" class="preference-menu" aria-label="语言">
            <button class="preference-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="languageOptions">中</button>
            <div id="languageOptions" class="preference-menu-items" aria-label="语言选项">
              <button type="button" data-lang="zh" aria-pressed="true" aria-label="中文">中文</button>
              <button type="button" data-lang="en" aria-pressed="false" aria-label="English">English</button>
            </div>
          </div>
          <div id="themeSwitch" class="preference-menu" aria-label="主题">
            <button class="preference-trigger" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="themeOptions">自动</button>
            <div id="themeOptions" class="preference-menu-items theme-menu-items" aria-label="主题选项">
              <button type="button" data-theme="light" aria-pressed="false" aria-label="亮色模式" title="亮色">亮色</button>
              <button type="button" data-theme="system" aria-pressed="true" aria-label="跟随系统" title="系统">自动</button>
              <button type="button" data-theme="dark" aria-pressed="false" aria-label="暗色模式" title="暗色">暗色</button>
            </div>
          </div>
        </div>
      </div>
    </header>

    <main class="directory">
      <section class="directory-head" aria-labelledby="page-title">
        <div class="hero-heading">
          <h1 id="page-title">
            <span class="hero-title">Everything is a plugin</span>
            <span class="hero-kicker">in <strong>DeepSeek Harness</strong></span>
          </h1>
          <div class="registry-status">
            <p id="registryMeta" data-i18n="loading">正在读取 Registry…</p>
            <span class="refresh-state"><i aria-hidden="true"></i><span data-i18n="autoRefresh">每 8 小时更新</span></span>
          </div>
        </div>

        <label class="search-box" for="searchInput">
          <span aria-hidden="true">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
              <circle cx="11" cy="11" r="6.75"></circle>
              <path d="m16 16 4 4"></path>
            </svg>
          </span>
          <span class="visually-hidden" data-i18n="searchLabel">搜索插件</span>
          <input id="searchInput" type="search" autocomplete="off" data-i18n-placeholder="searchPlaceholder" placeholder="搜索插件、作者、标签或功能…" />
          <kbd>⌘ K</kbd>
        </label>

        <div class="browse-controls">
          <div class="view-tabs" id="viewTabs" aria-label="浏览方式">
            <button type="button" data-view="popular" class="is-active" data-i18n="popular">热门</button>
            <button type="button" data-view="latest" data-i18n="latest">最新</button>
            <button type="button" data-view="curated" data-i18n="curated">精选</button>
          </div>

          <div class="filter-selects">
            <label>
              <span class="visually-hidden" data-i18n="kindLabel">类型</span>
              <select id="kindFilter"><option value="" data-i18n="allKinds">全部类型</option></select>
            </label>
            <label>
              <span class="visually-hidden" data-i18n="categoryLabel">分类</span>
              <select id="categoryFilter"><option value="" data-i18n="allCategories">全部分类</option></select>
            </label>
          </div>
        </div>

        <div class="collection-tabs" id="collectionTabs" hidden></div>
      </section>

      <section class="results" id="results" aria-labelledby="results-title">
        <div class="results-head">
          <h2 id="results-title"><span data-i18n="plugins">插件</span><small id="resultsCount"></small></h2>
          <div class="results-tools">
            <button id="resetFilters" class="reset-button" type="button" hidden data-i18n="reset">清除筛选</button>
            <div class="layout-toggle" id="layoutToggle" role="group" aria-label="展示形态">
              <button type="button" data-layout="list" aria-pressed="true"><span aria-hidden="true">☷</span><b data-i18n="listView">列表</b></button>
              <button type="button" data-layout="grid" aria-pressed="false"><span aria-hidden="true">▦</span><b data-i18n="cardView">卡片</b></button>
            </div>
          </div>
        </div>

        <div class="plugin-grid is-list" id="pluginGrid" aria-live="polite">
          <div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div><div class="skeleton-card"></div>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <strong>∅</strong>
          <h3 data-i18n="emptyTitle">没有找到匹配的插件</h3>
          <p data-i18n="emptyCopy">试试更短的关键词，或清除筛选。</p>
        </div>

        <button class="load-more" id="loadMoreButton" type="button" hidden>
          <span data-i18n="loadMore">加载更多</span><small id="loadMoreCount"></small>
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <div>
        <span>oh-my-dsh</span>
        <p data-i18n="disclaimer">Bundle 检测仅说明结构可安装，不代表兼容性或安全审查。</p>
      </div>
      <nav aria-label="页脚链接">
        <a href="https://github.com/wangshunnn/oh-my-dsh#状态说明" target="_blank" rel="noreferrer" data-i18n="statusGuide">状态说明</a>
        <a href="https://github.com/wangshunnn/oh-my-dsh/blob/main/LICENSE" target="_blank" rel="noreferrer">MIT License</a>
      </nav>
    </footer>

    <template id="pluginCardTemplate">
      <article class="plugin-card">
        <div class="card-top">
          <div class="card-badges"><span class="kind-badge"></span><span class="status-badge"></span></div>
        </div>
        <div class="card-title">
          <p class="plugin-owner"></p>
          <h3>
            <a class="plugin-link" target="_blank" rel="noreferrer"></a>
            <a class="external-link" target="_blank" rel="noreferrer" aria-label="在 GitHub 查看">↗</a>
          </h3>
        </div>
        <p class="plugin-description"></p>
        <div class="plugin-tags"></div>
        <div class="card-bottom">
          <dl class="plugin-meta">
            <div><dt>★</dt><dd class="plugin-stars"></dd></div>
            <div><dt>License</dt><dd class="plugin-license"></dd></div>
            <div><dt>Language</dt><dd class="plugin-language"></dd></div>
          </dl>
          <div class="card-action"></div>
        </div>
      </article>
    </template>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="./app.js" type="module"></script>
  </body>
</html>
