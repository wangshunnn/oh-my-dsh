name: Update registry

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Registry scan mode
        type: choice
        options:
          - incremental
          - full
        default: incremental
  schedule:
    - cron: "17 2,14 * * *"
    - cron: "47 3 * * 0"

permissions:
  contents: write

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update from GitHub
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_SCAN_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event.schedule == '47 3 * * 0' && 'full' || 'incremental') }}
      - run: npm run check
      - name: Commit generated registry
        run: |
          git add README.md README_EN.md registry/plugins.json docs/catalog.md docs/collections.md
          if git diff --cached --quiet; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(registry): refresh DSH plugin catalog"
          git push
