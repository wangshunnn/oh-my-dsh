name: Update registry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2,14 * * *"

permissions:
  contents: write

concurrency:
  group: update-registry
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Update from GitHub
        run: npm run update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run check
      - name: Commit generated registry
        run: |
          git add README.md README_EN.md registry/plugins.json registry/candidates.json registry/inspection-cache.json docs/catalog.md docs/collections.md
          if git diff --cached --quiet; then
            echo "Registry is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(registry): refresh DSH plugin catalog"
          git push
